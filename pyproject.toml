# Tooling config only (the app is installed from app/requirements.txt inside Docker).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP017"]

[tool.ruff.lint.isort]
known-first-party = ["fmi_pipeline", "fmi_bq", "fmi_daily_processing", "fake_bigquery", "sample_data"]
